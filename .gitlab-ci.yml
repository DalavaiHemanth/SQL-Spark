stages:
  - build
  - deploy

# ─────────────────────────────────────────
# BUILD — Install dependencies & Vite build
# ─────────────────────────────────────────
build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  variables:
    VITE_SUPABASE_URL: $VITE_SUPABASE_URL
    VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

# ─────────────────────────────────────────
# DEPLOY — Publish to GitLab Pages
# ─────────────────────────────────────────
pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - main

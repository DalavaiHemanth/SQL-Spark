stages:
  - build
  - deploy

# ──────────────────────────────────────────
# BUILD STAGE — install deps & run vite build
# ──────────────────────────────────────────
build:
  stage: build
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  variables:
    # Inject your Supabase secrets from GitLab CI/CD Variables
    VITE_SUPABASE_URL: $VITE_SUPABASE_URL
    VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
  script:
    - npm ci --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  only:
    - main

# ──────────────────────────────────────────
# DEPLOY STAGE — publish dist/ to GitLab Pages
# ──────────────────────────────────────────
pages:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  script:
    # GitLab Pages serves from a folder named "public"
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - main
